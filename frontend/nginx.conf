server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Course documents may be up to 100 MiB; the backend enforces the exact limit.
    client_max_body_size 105m;

    add_header X-Content-Type-Options nosniff always;

    # Streaming chat (SSE): never buffer, or the answer would arrive all at once at the end.
    location /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall back to index.html so client-side routes survive a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
