name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests use an isolated in-memory SQLite database and mocked model calls; no secrets are needed.
      DATABASE_URL: sqlite://
      JWT_SECRET_KEY: ci-only-secret-that-protects-nothing-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    env:
      # Placeholders so the compose file validates; nothing is started and no secret is used.
      MYSQL_ROOT_PASSWORD: ci-placeholder
      MYSQL_PASSWORD: ci-placeholder
      JWT_SECRET_KEY: ci-only-secret-that-protects-nothing-0123456789
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
